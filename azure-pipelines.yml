trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - gitops

variables:
  acrName: 'acrkiteworkstestapp1'
  imageName: 'kiteworks-app'
  imageTag: '$(Build.BuildId)-$(Build.SourceVersionShort)'
  imageRef: '$(acrName).azurecr.io/$(imageName):$(imageTag)'
  imageLatest: '$(acrName).azurecr.io/$(imageName):latest'
  gitleaksVersion: 'v8.18.4'
  trivyVersion: 'v0.53.0'
  gitopsRepoUrl: 'https://github.com/icelex10/KiteworksTestApp.git'
  gitopsBranch: 'gitops'
  azureServiceConnection: 'sc-kiteworks-azure'

pool:
  vmImage: ubuntu-latest

steps:
- checkout: self

- bash: |
    set -euo pipefail
    mkdir -p "$HOME/bin"
    GITLEAKS_VERSION="v8.18.4"
    GITLEAKS_ARCHIVE="gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
    curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}" -o /tmp/gitleaks.tar.gz
    tar -xzf /tmp/gitleaks.tar.gz -C /tmp
    install -m 755 /tmp/gitleaks "$HOME/bin/gitleaks"
    echo "##vso[task.prependpath]$HOME/bin"
  displayName: Install Gitleaks

- bash: |
    set -euo pipefail
    gitleaks detect --no-banner --redact --source . --exit-code 1 --log-opts="--all --full-history"
  displayName: Secret scan with Gitleaks

- bash: |
    set -euo pipefail
    mkdir -p "$HOME/bin"
    TRIVY_VERSION="0.53.0"
    curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o /tmp/trivy.tar.gz
    tar -xzf /tmp/trivy.tar.gz -C /tmp
    install -m 755 /tmp/trivy "$HOME/bin/trivy"
    echo "##vso[task.prependpath]$HOME/bin"
  displayName: Install Trivy

- task: AzureCLI@2
  displayName: Login to Azure and ACR
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      set -euo pipefail
      az acr login --name $(acrName)

- bash: |
    set -euo pipefail
    docker build --pull --tag "$(imageRef)" --tag "$(imageLatest)" .
  displayName: Build application image

- bash: |
    set -euo pipefail
    trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$(imageRef)"
  displayName: Image scan with Trivy

- bash: |
    set -euo pipefail
    docker push "$(imageRef)"
    docker push "$(imageLatest)"
  displayName: Push image to ACR

- bash: |
    set -euo pipefail
    mkdir -p /tmp/gitops-repo
    git clone --branch "$(gitopsBranch)" "$(gitopsRepoUrl)" /tmp/gitops-repo
    cd /tmp/gitops-repo

    if [ ! -f gitops/dev/kustomization.yaml ]; then
      echo "dev kustomization not found"
      exit 1
    fi

    curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
    chmod +x kustomize
    ./kustomize edit set image kiteworks-app="$(imageRef)"

    git config user.email "azuredevops@local"
    git config user.name "Azure DevOps"
    git add .
    git diff --cached --quiet || git commit -m "Deploy $(imageName):$(imageTag)"
    git push origin "$(gitopsBranch)"
  displayName: Update GitOps image tag and push to repo
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/gitops'))
